# Deploy del portal de pruebas (GitHub Pages)
#
# Solo corre si cambió `beta-portal/**` (o este workflow).
# Runner por defecto: ubuntu-latest (GitHub-hosted). No requiere tu PC encendida.
# Opcional (workflow_dispatch): self-hosted si tienes runner propio registrado.
# Credenciales: GitHub → Settings → Secrets and variables → Actions
#   - SUPABASE_URL_PDN      (= frontend/env/pdn.env → mismo valor)
#   - SUPABASE_ANON_KEY_PDN (= frontend/env/pdn.env → mismo valor)
#
# Nunca uses service_role aquí. El APK y beta_release se actualizan
# en local con backend/.env (publish_beta_apk.py), no en este deploy.

name: beta-portal-pages

on:
  push:
    branches: [main, master]
    paths:
      - "beta-portal/**"
      - ".github/workflows/beta-portal-pages.yml"
  workflow_dispatch:
    inputs:
      runner:
        description: Runner (github-hosted o self-hosted)
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
        default: ubuntu-latest

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Un solo deploy: al lanzar otro, cancela el que está corriendo y el pending.
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site (solo carpeta beta-portal)
        env:
          SUPABASE_URL_PDN: ${{ secrets.SUPABASE_URL_PDN }}
          SUPABASE_ANON_KEY_PDN: ${{ secrets.SUPABASE_ANON_KEY_PDN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL_PDN}" ] || [ -z "${SUPABASE_ANON_KEY_PDN}" ]; then
            echo "Faltan secrets SUPABASE_URL_PDN / SUPABASE_ANON_KEY_PDN"
            echo "Copia los valores de frontend/env/pdn.env (proyecto chevere_plan_pdn)."
            exit 1
          fi
          mkdir -p _site
          # Solo el HTML público; no scripts Python ni fuentes de build.
          python3 - <<'PY'
          from pathlib import Path
          import os
          src = Path("beta-portal/index.html").read_text(encoding="utf-8")
          out = (
              src.replace("__SUPABASE_URL_PDN__", os.environ["SUPABASE_URL_PDN"])
              .replace("__SUPABASE_ANON_KEY_PDN__", os.environ["SUPABASE_ANON_KEY_PDN"])
          )
          if "__SUPABASE_" in out and "_PDN__" in out:
              raise SystemExit("Quedaron placeholders sin reemplazar")
          Path("_site/index.html").write_text(out, encoding="utf-8")
          print("ok: _site/index.html")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
